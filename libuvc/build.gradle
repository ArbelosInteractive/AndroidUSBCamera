apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

import org.apache.tools.ant.taskdefs.condition.Os

publishing {
    publications {
        // "release" here is just the publication name, you can call it whatever
        release(MavenPublication) {
            afterEvaluate {
                artifact("$buildDir/outputs/aar/libuvc-release.aar")

                groupId = "com.jiangdg"   
                artifactId = "libuvc"       
                version = "3.3.0"              
            }
        }
    }

    repositories {
		maven {
            name = "localTest"
            url = uri("${buildDir}/mavenLocalTest")
        }
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/arbelos/AndroidUSBCamera"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

tasks.withType(PublishToMavenRepository) {
    dependsOn(":libuvc:assembleRelease")
}

android {
	namespace = "com.jiangdg.uvccamera"
	compileSdkVersion rootProject.ext.versionCompiler
	ndkVersion rootProject.ext.ndkVersion

	compileOptions {
		sourceCompatibility rootProject.ext.javaSourceCompatibility
		targetCompatibility rootProject.ext.javaTargetCompatibility
	}

	defaultConfig {
		minSdkVersion rootProject.ext.minSdkVersion
		targetSdkVersion rootProject.ext.versionTarget
	}

	lintOptions {
		checkReleaseBuilds false
		// Or, if you prefer, you can continue to check for errors in release builds,
		// but continue the build even when errors are found:
		abortOnError false
		// The demo app does not have translations.
		disable 'MissingTranslation'
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
		}
	}
}

tasks.withType(JavaCompile) {
	compileTask -> compileTask.dependsOn ndkBuild
}

String getNdkBuildPath() {
	Properties properties = new Properties()
	properties.load(project.rootProject.file('local.properties').newDataInputStream())
	def sdkBuildingDir = properties.getProperty("sdk.dir")
	def ndkBuildingDir = sdkBuildingDir + "/ndk/" + rootProject.ext.ndkVersion

	def ndkBuildPath = ndkBuildingDir
	if (Os.isFamily(Os.FAMILY_WINDOWS)) {
		ndkBuildPath = ndkBuildingDir + '/ndk-build.cmd'
	} else {
		ndkBuildPath = ndkBuildingDir + '/ndk-build'
	}
	return ndkBuildPath
}

task ndkBuild(type: Exec, description: 'Compile JNI source via NDK') {
	println('executing ndkBuild')
	def ndkBuildPath = getNdkBuildPath();
	commandLine ndkBuildPath, 'V=1', '-j8', '-C', file('src/main').absolutePath
}

task ndkClean(type: Exec, description: 'clean JNI libraries') {
	println('executing ndkBuild clean')
	def ndkBuildPath = getNdkBuildPath();
	commandLine ndkBuildPath, 'clean', '-C', file('src/main').absolutePath
}

clean.dependsOn 'ndkClean'

dependencies {
	implementation fileTree(dir: new File(buildDir, 'libs'), include: '*.jar')
	implementation "androidx.appcompat:appcompat:${androidXVersion}"
	implementation 'com.elvishew:xlog:1.11.0'
//	implementation project(path: ':libuvccommon')
}
