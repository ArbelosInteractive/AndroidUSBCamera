name: Publish package to GitHub Packages

on:
    release:
        types: [created]

    push:
        branches:
            - feature-fix-workflow
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Install NDK 28.0.12433566
              run: |
                  yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.12433566"

            - name: Accept Android SDK Licenses
              run: yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

            - name: Create local.properties
              run: |
                  echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
                  echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

            - name: Publish package
              run: ./gradlew publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACTOR: ${{ github.actor }}
